<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>배프 전체 화면 보기 · 프로토타입</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>:root{--blue:#5EA9F2;--yellow:#FFC93C;--green:#7FE0A8;--action:#1A66B8;--actp:#14528F;--soft:#E6F1FC;--ysoft:#FFF8E7;--bg:#fff;--grey:#F2F4F6;--grey2:#E5E8EB;--sub:#F4F6F8;--ink:#1F2937;--muted:#4B5563;--line:#D1D5DB;--ok:#1E7A4A;--warn:#8A5A00;--danger:#C62828;--fs:1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sub);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--action)}
.demo{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;font-size:13px}
.demo b{margin-right:4px}
.demo button{border:none;border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;cursor:pointer;min-height:32px}
.demo button.on{background:#fff;color:var(--ink)}
.demo .sp{flex:1}
.demo select{border-radius:8px;border:none;padding:5px 8px;max-width:200px}
.shell{display:flex;min-height:calc(100vh - 48px)}
.side{display:none}
.main{flex:1;display:flex;justify-content:center;min-width:0}
.page{width:100%;max-width:560px;background:var(--bg);min-height:calc(100vh - 48px);display:flex;flex-direction:column;position:relative}
.page.wide{max-width:none;background:var(--sub)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:60px;padding:0 12px;flex:none}
.back{display:flex;align-items:center;gap:2px;min-height:48px;padding:0 8px;border:none;background:none;font-size:calc(18px*var(--fs));cursor:pointer}
.pill{border:none;border-radius:999px;background:var(--grey);min-height:44px;padding:0 14px;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px}
.h{padding:8px 24px 22px}
.h h1{margin:0;font-size:calc(28px*var(--fs));line-height:1.35;letter-spacing:-.6px}
.h p{margin:8px 0 0;color:var(--muted);font-size:calc(18px*var(--fs))}
.body{flex:1;padding:0 20px 16px;display:flex;flex-direction:column;gap:12px}
.foot{position:sticky;bottom:0;padding:12px 20px 24px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.btn{width:100%;min-height:calc(60px*var(--fs));border:none;border-radius:16px;background:var(--action);color:#fff;font-size:calc(20px*var(--fs));font-weight:700;letter-spacing:-.3px;cursor:pointer;padding:10px 16px}
.btn:hover{background:var(--actp)}
.btn.sec{background:var(--grey);color:var(--ink)}.btn.soft{background:var(--soft);color:var(--action)}.btn.kakao{background:#FEE500;color:#191919}.btn.danger{background:#FDECEC;color:var(--danger)}.btn.red{background:var(--danger)}
.btn:disabled{background:var(--grey2);color:#8B95A1;cursor:not-allowed}
.btn small{display:block;font-size:14px;font-weight:500;opacity:.9}
.link{border:none;background:none;min-height:44px;font-weight:700;text-decoration:underline;color:var(--muted);cursor:pointer;font-size:calc(17px*var(--fs))}
.card{background:var(--grey);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.card.soft{background:var(--soft)}.card.y{background:var(--ysoft)}.card.w{background:var(--bg);border:1px solid var(--grey2)}
.big{font-size:calc(23px*var(--fs));font-weight:700;letter-spacing:-.4px;margin:0}
.t{margin:0;font-size:calc(18px*var(--fs))}.m{color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:calc(17px*var(--fs))}.row span:first-child{color:var(--muted)}.row span:last-child{font-weight:700;text-align:right}
.badge{align-self:flex-start;padding:4px 12px;border-radius:999px;font-size:15px;font-weight:700}
.b-wait{background:#FFF1C7;color:#7A5200}.b-ok{background:var(--soft);color:var(--action)}.b-done{background:#DDF5E7;color:var(--ok)}.b-cancel{background:#FDECEC;color:var(--danger)}.b-grey{background:var(--grey);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{position:relative;min-height:88px;padding:16px;border:2px solid transparent;border-radius:20px;background:var(--grey);text-align:left;font-size:calc(19px*var(--fs));font-weight:700;cursor:pointer}
.choice.on{border-color:var(--action);background:var(--soft)}
.choice small{display:block;font-size:15px;font-weight:500;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid transparent;background:var(--grey);font-weight:700;cursor:pointer;font-size:calc(16px*var(--fs))}
.chip.on{border-color:var(--action);background:var(--soft);color:var(--action)}
.chip:disabled{text-decoration:line-through;color:#8B95A1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700;color:var(--muted)}
.inp{min-height:56px;padding:0 16px;border:2px solid transparent;border-radius:14px;background:var(--grey);font-size:calc(20px*var(--fs));font-weight:600;width:100%}
.inp:focus{outline:none;border-color:var(--action);background:#fff}
textarea.inp{padding:12px 16px;min-height:96px;resize:vertical}
.av{flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tabs{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid var(--grey2);margin-top:auto}
.tabs button{flex:1;min-height:68px;border:none;background:none;font-size:14px;font-weight:600;color:#8B95A1;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button.on{color:var(--ink);font-weight:800}
.dot{position:absolute;top:8px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;line-height:18px}
.sheetbg{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:24px 24px 0 0;padding:24px 20px 28px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:70;font-weight:600;max-width:90vw}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 0 10px}
.ico{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:32px}
.list>*{border-bottom:1px solid var(--grey2)}
.mrow{display:flex;justify-content:space-between;align-items:center;min-height:60px;border:none;border-bottom:1px solid var(--grey2);background:none;width:100%;font-size:calc(19px*var(--fs));font-weight:700;cursor:pointer;text-align:left;padding:0 4px}
.mrow span{font-size:15px;font-weight:500;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--grey2);overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.mark{display:inline-flex;align-items:center}
.orbs{position:absolute;pointer-events:none}
.orbs i{position:absolute;border-radius:999px}
.hostbar{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 8px 0 16px;background:var(--ink);color:#fff;font-weight:700}
.hostbar button{border:none;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;min-height:40px;padding:0 14px;font-weight:700;cursor:pointer}
.mission{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--ysoft);border-bottom:1px solid var(--grey2);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal button{min-height:46px;border:none;border-radius:999px;background:none;font-size:17px;cursor:pointer;color:#8B95A1}
.cal button.av1{color:var(--action);font-weight:800}
.cal button.sel{background:var(--action);color:#fff}
.cal button:disabled{cursor:default}
table{width:100%;border-collapse:collapse}th{text-align:left;padding:10px 12px;font-size:13px;color:var(--muted);background:var(--sub)}td{padding:12px;border-top:1px solid var(--grey2);font-size:15px}
.wide .wrap{max-width:1120px;width:100%;margin:0 auto;padding:28px 24px 48px;display:flex;flex-direction:column;gap:18px}
.wcard{background:#fff;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.kpis{display:flex;flex-wrap:wrap;gap:12px}.kpi{flex:1;min-width:150px;background:#fff;border-radius:16px;padding:18px}.kpi b{display:block;font-size:28px}
.sbtn{min-height:40px;padding:0 16px;border:none;border-radius:10px;background:var(--action);color:#fff;font-weight:700;cursor:pointer}
.sbtn.sec{background:var(--grey);color:var(--ink)}.sbtn.soft{background:var(--soft);color:var(--action)}.sbtn.danger{background:#FDECEC;color:var(--danger)}
.adm{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 48px)}
.adm aside{display:none}
.admnav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--grey2)}
.admnav button{white-space:nowrap}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
.webtop{display:flex;align-items:center;gap:16px;padding:0 20px;min-height:64px;background:#fff;border-bottom:1px solid var(--grey2)}
.webfoot{padding:24px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px;border-top:1px solid var(--grey2);background:var(--sub)}
.notice{font-size:14px;color:var(--warn);font-weight:700}
:focus-visible{outline:3px solid var(--action);outline-offset:2px}
@media (min-width:900px){
 .shell.mob .side{display:flex;flex-direction:column;gap:4px;width:240px;flex:none;background:#fff;border-right:1px solid var(--grey2);padding:20px 14px}
 .shell.mob .side button{text-align:left;min-height:48px;padding:0 14px;border:none;border-radius:12px;background:none;font-weight:700;font-size:16px;cursor:pointer;position:relative}
 .shell.mob .side button.on{background:var(--soft);color:var(--action)}
 .shell.mob .main{padding:28px}
 .shell.mob .page{border-radius:24px;min-height:calc(100vh - 104px);box-shadow:0 2px 10px rgba(31,41,55,.06);max-width:720px}
 .shell.mob .tabs{display:none}
 .shell.mob .foot{border-radius:0 0 24px 24px}
 .h h1{font-size:calc(32px*var(--fs))}
 .adm{grid-template-columns:240px 1fr}
 .adm aside{display:flex;flex-direction:column;gap:2px;background:#fff;border-right:1px solid var(--grey2);padding:20px 14px}
 .adm aside button{text-align:left;min-height:44px;padding:0 14px;border:none;border-radius:10px;background:none;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
 .adm aside button.on{background:var(--soft);color:var(--action)}
 .admnav{display:none}
 .cols{grid-template-columns:3fr 2fr}
 .cols.eq{grid-template-columns:1fr 1fr}
 .cols.l{grid-template-columns:300px 1fr}
}
.card .btn.sec,.card .btn.soft{background:#fff}
.card.soft .btn.soft{background:#fff}
.demo select{color:var(--ink);background:#fff}
.mrow{justify-content:flex-start;gap:10px}.mrow>span:last-child{margin-left:auto}
.adm aside .sbtn{background:none;color:var(--ink)}.adm aside .sbtn.soft{background:var(--soft);color:var(--action)}
@media (max-width:600px){.demo{font-size:12px;gap:4px;padding:6px 8px}.demo button{padding:4px 9px;min-height:28px}.demo select{max-width:140px}}
/* 연습 앱 */
.pnote{background:#FFF1C7;color:#7A5200;font-size:13px;font-weight:700;padding:6px 16px}
.pwrong{background:#FDECEC;color:var(--danger);font-weight:700;padding:10px 16px;animation:shake .35s}
.phone{flex:1;display:flex;flex-direction:column;background:#fff;min-height:520px;border-bottom:1px solid var(--grey2)}
.pctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 20px;position:sticky;bottom:0;background:#fff}
.app-top{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;font-size:18px}
.pk{font:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:inherit}
.pk-x{font-size:26px;color:var(--muted)}
.lst{display:flex;flex-direction:column}
.lrow{display:flex;gap:12px;align-items:center;min-height:68px;padding:10px 16px;border-bottom:1px solid var(--grey2);width:100%;font-size:17px}
.lrow:hover{background:var(--sub)}
.dotn{display:inline-block;min-width:20px;height:20px;border-radius:999px;background:#F04B4B;color:#fff;font-size:12px;text-align:center;line-height:20px;font-weight:700}
.chatbody{flex:1;background:#BACEE0;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:70%;padding:10px 14px;border-radius:16px;font-size:17px;background:#fff}.bub.r{align-self:flex-end;background:#FEE500}
.chatin{display:flex;gap:8px;align-items:center;padding:10px;background:#fff}
.pinp{flex:1;min-height:48px;border:2px solid var(--grey2);border-radius:999px;padding:0 16px;font-size:17px}
.pinp:focus{outline:none;border-color:var(--action)}
.circ{width:44px;height:44px;border-radius:999px;background:var(--grey);font-size:24px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.sendb{min-height:44px;padding:0 14px;border-radius:999px;background:#FEE500;font-weight:700}
.pgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.pgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.pmenu{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--grey);font-size:14px;font-weight:600}
.img{display:block;width:100%;aspect-ratio:1;border-radius:10px}
.pic{position:relative;display:block;padding:0}.pic .cap{position:absolute;left:6px;bottom:6px;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.5)}.pic.sel{outline:4px solid #FEE500;border-radius:10px}
.yb{min-height:48px;padding:0 20px;border-radius:12px;background:#FEE500;font-weight:800}
.ico2{font-size:22px}
.psheet{margin-top:auto;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.15);display:flex;flex-direction:column}
.prow{min-height:64px;padding:0 20px;font-size:19px;font-weight:700;border-bottom:1px solid var(--grey2);text-align:left}
.vcall{flex:1;display:flex;flex-direction:column;background:linear-gradient(#3A4A5C,#1F2937)}
.vb{color:#fff;width:84px;height:84px;border-radius:999px;background:rgba(255,255,255,.18);font-size:24px;line-height:1.1}.vb small{font-size:12px}.vb.red{background:#E5484D}
.srch{display:block;background:#fff;color:var(--muted);border-radius:12px;min-height:48px;padding:12px 14px;font-size:17px;text-align:left;width:100%;border:1px solid var(--grey2)}
.pbody{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.pfoot{padding:12px 16px 16px}
.tb{width:100%;min-height:56px;border-radius:12px;background:var(--action);color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.tb.dis{background:var(--grey2);color:#8B95A1}
.dayc{flex:1;min-height:64px;border-radius:14px;background:var(--grey);font-size:17px}.dayc.off{opacity:.4;text-decoration:line-through}
.tslot{min-height:52px;border-radius:12px;background:var(--grey);font-weight:700;font-size:16px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center}.tslot.off{opacity:.45;text-decoration:line-through}
.tcell{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--grey);min-height:72px}
.seats{display:grid;grid-template-columns:1fr 1fr 18px 1fr 1fr;gap:8px}
.seat{min-height:52px;border-radius:10px;background:#D7E8FB;font-weight:700}.seat.off{background:var(--grey2);color:#8B95A1}
.ticket{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:18px;border:2px dashed var(--line);background:#fff}
.qr{width:120px;height:120px;background:repeating-linear-gradient(45deg,#1F2937 0 6px,#fff 6px 12px);border-radius:6px;align-self:center}
.tog{width:52px;height:30px;border-radius:999px;background:var(--grey2);position:relative}.tog::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:999px;background:#fff;transition:.2s}.tog.on{background:#2AC1BC}.tog.on::after{left:25px}
.track{display:flex;gap:6px;width:100%}.track span{flex:1;padding:8px 4px;border-radius:8px;background:var(--grey);font-size:13px;font-weight:700}.track span.on{background:#2AC1BC;color:#fff}
.kio{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px;background:#FBF7F2}
.ktabs{display:flex;gap:6px;overflow-x:auto}.ktab{padding:10px 14px;border-radius:10px;background:#fff;font-weight:700;white-space:nowrap}.ktab.on{background:#4E3B31;color:#fff}
.kitem{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:12px;background:#fff;text-align:left}
.kcart{margin-top:auto;background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.kbig{min-height:120px;border-radius:16px;background:#fff;font-size:20px;font-weight:800}
/* 코치마크 */
.coach{position:fixed;inset:0;z-index:80}
.coach .hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(17,24,39,.62);animation:pulse 1.4s infinite;pointer-events:none}
.cbub{position:fixed;width:300px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
.cbub p{margin:0;font-size:17px;line-height:1.5}
.carr{position:absolute;width:20px;height:20px;background:#fff;transform:rotate(45deg)}.carr.up{top:-9px}.carr.down{bottom:-9px}
.shake{animation:shake .35s}
@keyframes pulse{0%,100%{outline:3px solid rgba(255,201,60,.95);outline-offset:0}50%{outline:6px solid rgba(255,201,60,.4);outline-offset:6px}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.coach .hole,.shake,.pwrong{animation:none}}
/* 매칭 축하 화면 */
.match{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 20px 32px;background:linear-gradient(#FFF8E7,#fff 40%)}
.mstage{position:relative;width:260px;height:150px}
.mstage i{position:absolute;top:10px;width:130px;height:130px;border-radius:999px}
.mb{left:0;background:radial-gradient(circle at 32% 28%,#D8ECFE,#5EA9F2 62%,#4A93DC);animation:mleft 1s ease-out both}
.my{right:0;background:radial-gradient(circle at 32% 28%,#FFF3CC,#FFC93C 62%,#F0B323);mix-blend-mode:multiply;animation:mright 1s ease-out both}
.mface{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:24px;font-weight:800;opacity:0;animation:mface .4s .9s ease-out forwards}
.mt{margin:0;font-size:30px;font-weight:800;text-align:center;line-height:1.3;letter-spacing:-.6px}
.mcard{width:100%;max-width:420px;display:flex;gap:12px;align-items:center;background:var(--grey);border-radius:18px;padding:16px}
@keyframes mleft{from{transform:translateX(-90px);opacity:0}to{transform:translateX(35px);opacity:1}}
@keyframes mright{from{transform:translateX(90px);opacity:0}to{transform:translateX(-35px);opacity:1}}
@keyframes mface{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.mb,.my{animation:none}.mb{transform:translateX(35px)}.my{transform:translateX(-35px)}.mface{animation:none;opacity:1}}
/* fix3: 사용자 검토 */
.toast{top:16px;bottom:auto}
.row span:first-child{white-space:nowrap;flex:none}
.calh{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:14px;font-weight:700;color:var(--muted);margin-top:8px}
.calh .sat,.cal button.sat.av1{color:#3D7BE0}.calh .sun{color:#E5484D}.cal button.sun.av1{color:#E5484D}
.cal button.sel{color:#fff!important}
.webtop nav .sbtn{white-space:nowrap;flex:none}
.startpick{display:grid;gap:10px;max-width:460px}
.wcard{overflow-x:auto;min-width:0}.adm>*{min-width:0}.wcard table{min-width:480px}
@media (max-width:700px){.webtop{flex-wrap:wrap;padding:10px 16px;gap:8px 12px;min-height:56px}.webtop nav{order:3;width:100%}.wrap{padding-left:16px;padding-right:16px}}
/* fix4: 연습 '지금 할 일' 카드 */
.mission2{position:sticky;top:0;z-index:5;margin:10px 10px 6px;padding:14px 14px 14px 16px;background:#1B2B48;color:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(27,43,72,.25)}
.mission2 .mtop{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}
.mission2 .mlabel{color:#FFD25A}.mission2 .mstep{color:#C9D3E6}
.mission2 .mbar{height:6px;background:rgba(255,255,255,.18);border-radius:9px;margin:8px 0 10px;overflow:hidden}.mission2 .mbar i{display:block;height:100%;background:#FFD25A;border-radius:9px}
.mission2 .mline{display:flex;align-items:center;gap:10px}
.mission2 .mhand{color:#FFD25A;flex:none}
.mission2 .mtext{margin:0;flex:1;font-size:calc(22px*var(--fs));line-height:1.35;font-weight:800;letter-spacing:-.4px}
.mission2 mark{background:#FFD25A;color:#1B2B48;border-radius:6px;padding:0 5px}
.mission2 .mspeak{flex:none;width:44px;height:44px;border-radius:12px;border:none;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.mflash{animation:mflash .9s ease}
@keyframes mflash{0%{transform:scale(.97);box-shadow:0 0 0 0 rgba(255,210,90,.9)}60%{transform:scale(1.01);box-shadow:0 0 0 10px rgba(255,210,90,0)}100%{transform:none}}
.pnudge{outline:3px solid #FFB800!important;outline-offset:3px;border-radius:10px;animation:pnudge 1.4s ease-in-out infinite}
@keyframes pnudge{0%,100%{outline-color:rgba(255,184,0,1)}50%{outline-color:rgba(255,184,0,.25)}}
@media (prefers-reduced-motion:reduce){.mflash,.pnudge{animation:none}}
/* 임시 공통 글꼴 (사용자가 글꼴을 고르면 교체) · 막대 겹침 수정 */
html,body,button,input,select,textarea{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bar{display:block;margin:6px 0 4px}
/* fix5: 자녀 결제 요청 한 화면 */
.pr{max-width:480px;margin:0 auto;padding:0 20px 28px;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 60px);background:#fff}
.prtop{display:flex;align-items:center;gap:8px;height:56px;font-size:17px}
.prok{display:inline-flex;align-items:center;gap:6px;margin:6px 0 0;font-size:15px;font-weight:700;color:var(--ok,#1E7A4A)}
.prh{margin:0;font-size:28px;line-height:1.35;letter-spacing:-.8px}
.pramt{display:flex;flex-direction:column;padding:16px 18px;border-radius:16px;background:#F4F6F8}
.pramt span{font-size:34px;font-weight:800;letter-spacing:-1px}
.pramt small{font-size:15px;font-weight:700;color:#B26A00}
.prrows{display:flex;flex-direction:column;gap:8px}
.prpay{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.prmain{height:60px;border:none;border-radius:14px;font-size:19px;font-weight:800;cursor:pointer}
.prmore{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prmore button{height:48px;border:1px solid #E5E8EB;border-radius:12px;background:#fff;font-size:15px;font-weight:700;cursor:pointer}
/* ===== fix6: A 또렷한 목록형 디자인 ===== */
:root{--action:#1F5BD8;--actp:#1749B0;--soft:#EAF1FD;--grey:#F4F5F7;--grey2:#EEF0F3;--ink:#191F28;--muted:#6B7684;--sub:#F4F5F7;--line:#E5E8EB}
.h h1{font-weight:800;letter-spacing:-.8px}
.btn{border-radius:14px}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #D1D6DB}.btn.sec:hover{background:var(--grey)}
.btn.soft{background:var(--soft)}
.btn.ghost{background:none;color:var(--muted);min-height:48px;font-size:calc(17px*var(--fs))}.btn.ghost:hover{background:var(--grey)}
.card{background:#fff;border:1px solid var(--grey2);border-radius:16px}
.card.soft{background:#fff;border-color:var(--grey2)}.card.y{background:#FFF8E1;border:none}.card.w{background:#fff}
.choice{background:#fff;border:1.5px solid #E5E8EB;border-radius:14px}
.choice.on{border-color:var(--action);background:var(--soft)}
.chip{background:#fff;border:1.5px solid #E5E8EB;border-radius:10px}
.chip.on{background:var(--soft);border-color:var(--action)}
.badge{border-radius:6px;font-size:13px;padding:3px 8px}
.inp{background:var(--grey);border-radius:12px}
.pill{background:#fff;border:1px solid #E5E8EB;border-radius:10px;min-height:40px;font-size:14px;display:inline-flex;align-items:center;gap:4px;position:relative}
.ibtn{width:44px;justify-content:center;padding:0}
.helpb{color:var(--action);border-color:#C9DAF8}
[class*="orb"],.orbs{display:none!important}
.tabs button{gap:3px;font-size:13px}.tabs button svg{color:inherit}

.li{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:10px 0;border:none;border-top:1px solid #F2F3F5;background:none;text-align:left;cursor:pointer;color:var(--ink)}

.li em{font-style:normal;font-size:12px;font-weight:700;color:var(--action);background:var(--soft);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:3px}

.prmom{margin:0;background:#FFF8E1;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5}.prmom b{display:block;font-size:13px;color:#7A5200}
.prauto{display:flex;gap:8px;align-items:flex-start;font-size:15px;font-weight:600;line-height:1.5}.prauto input{width:20px;height:20px;margin-top:2px}

.ck{display:flex;gap:10px;align-items:center;min-height:44px;font-size:17px;font-weight:600}.ck input{width:22px;height:22px}
.dot{right:-4px}
.tgl{width:52px;height:30px;border-radius:99px;border:none;background:#D1D6DB;position:relative;cursor:pointer;flex:none}
.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{background:var(--action)}.tgl.on i{left:25px}
.steps3{margin:0;padding-left:0;list-style:none;counter-reset:s;display:flex;flex-direction:column}
.steps3 li{counter-increment:s;display:flex;gap:14px;align-items:center;min-height:64px;border-top:1px solid #F2F3F5;font-size:calc(18px*var(--fs));font-weight:600}
.steps3 li:first-child{border-top:none}
.steps3 li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:99px;background:var(--soft);color:var(--action);font-weight:800;display:flex;align-items:center;justify-content:center}
.demohint{margin-top:8px;padding:12px 14px;border:1.5px dashed #C9D0DA;border-radius:12px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.demohint b{color:var(--ink)}
.hmock{align-self:center;width:230px;padding:22px 18px 26px;border-radius:30px;background:linear-gradient(#DCE7F5,#C9D8EC);border:6px solid #1B1F27}

/* fix12 첫 화면 평면 애니메이션 */
.splw{display:flex;justify-content:center;margin-bottom:10px}
  .flat{width:250px;height:150px;display:none}
  .flat.on{display:block}
  .flat .fb,.flat .fy,.flat .syn,.flat .face,.flat .sh{transform-box:fill-box;transform-origin:center}
  .flat.on .fb{animation:inL 1s cubic-bezier(.2,.8,.25,1) both}
  .flat.on .fy{animation:inR 1s cubic-bezier(.2,.8,.25,1) both}
  .flat.on .sh{animation:fin .8s ease .3s both}
  .flat.on .syn{animation:fin .35s ease .95s both}
  .flat.on .face{animation:popf .5s cubic-bezier(.3,1.6,.5,1) 1.1s both}
  .flat.idle{animation:float 3s ease-in-out infinite}
  @keyframes inL{from{transform:translateX(-170px) rotate(-200deg)}to{transform:none}}
  @keyframes inR{from{transform:translateX(170px) rotate(200deg)}to{transform:none}}
  @keyframes fin{from{opacity:0}}
  @keyframes popf{from{opacity:0;transform:scale(.2)}}
  @keyframes float{50%{transform:translate(-50%,calc(-50% - 5px))}}
.spt{animation:fin .6s ease 1.4s both}

P['p-result']=()=>{const r=S.lastResult||{k:'taxi',solo:false,sec:124,hints:1,mist:0};const n=PRACT.find(x=>x[0]===r.k)[1];const stepsL=r.steps||['도착지 검색하기','택시 종류·요금 보기','탈 곳 확인하기','호출하고 차량 확인'].map((m,i,a)=>({m,hint:!r.solo&&i===a.length-1,wrong:0}));

P['f-comment']=()=>{const b=fcur();if(!b)return noBooking();return{html:`${topb()}${H('수업 코멘트')}<div class="body"><div class="card">${row('배움님',S.senior.name)}${row('수업',when(b))}</div><span class="f">오늘 배운 것</span><div class="chips">${b.topics.map(t=>`<button type="button" class="chip on">${t}</button>`).join('')}</div><span class="f">얼마나 익히셨나요? (숙지도)</span><div class="chips" id="mast">${['처음','도움 받으면 함','혼자 함'].map((m,i)=>`<button type="button" class="chip ${i===1?'on':''}" onclick="[...this.parentNode.children].forEach(c=>c.classList.remove('on'));this.classList.add('on')">${m}</button>`).join('')}</div><label class="f">다음에 연습할 것 (필수)<textarea class="inp" id="cnext" placeholder="예) 목적지 검색에서 자주 헤매셨어요" oninput="document.getElementById('csave').disabled=!this.value.trim()"></textarea></label><label class="f">배움님께 한마디 (선택)<textarea class="inp" id="cmsg" placeholder="예) 오늘 정말 잘하셨어요!"></textarea></label></div>${foot(`<button type="button" class="btn" id="csave" disabled ${ACT('saveComment')}>코멘트 남기기</button>`)}`}};
P['f-settle']=()=>{const list=fmine().filter(b=>b.status==='COMPLETED'||b.status==='NO_SHOW').slice().reverse();return{html:`${topb()}${H('정산 내역')}<div class="body"><div class="card soft"><b class="m">이번 달 받을 금액</b><p style="margin:0;font-size:30px;font-weight:800">${won(settleTotal())}</p><span class="m">${S.friend.bank}으로 들어와요 · 주 1회 ⭐</span></div><div class="list">${list.map(b=>`<div style="display:flex;justify-content:space-between;padding:14px 0"><div><b>11.${b.day} · ${esc(S.senior.name)}</b><br><span class="m">${b.dur===60?'1시간':'1시간 30분'}</span></div><div style="text-align:right"><b>${won(b.status==='NO_SHOW'?fee(b)*.5:fee(b)*.9)}</b><br><span style="font-weight:700;color:${b.settled==='입금 완료'?'var(--ok)':'var(--warn)'}">${b.comment||b.status==='NO_SHOW'?(b.settled||'입금 예정'):'코멘트 쓰면 정산'}</span></div></div>`).join('')}</div><p class="m" style="margin:0;font-size:14px">수업료에서 수수료 10%를 뺀 금액 ⭐ · 세금(3.3%)은 팀 확정 전</p><button type="button" class="link" ${G('f-account')}>정산 계좌 바꾸기</button></div>`,role:'friend',tab:'f-settle'}};
P['f-notes']=()=>notesPage('friend','f-notes');
P['f-me']=()=>({html:`<div class="top"></div><div class="body"><div style="display:flex;gap:14px;align-items:center">${av('민',60)}<div><b class="big">${esc(fname())} 프렌드</b><br><span class="m">경희대 3학년 · 후기 4.8</span></div></div><div>${mrow('가능한 시간·반경 바꾸기','토·일 · 3km',G('f-signup2'))}${mrow('정산 계좌',S.friend.bank,G('f-account'))}${mrow('정산 내역','',G('f-settle'))}${mrow('잠시 쉬기',S.friend.paused?'쉬는 중':'요청 받는 중',ACT('pause'))}${mrow('역할 바꾸기','배움님으로',G('s-role'))}${mrow('안심 수업 약속',S.friend.promise?'확인함':'확인 필요',G('f-promise'))}${mrow('첫 수업 가이드','',G('f-guide'))}${mrow('불편 알리기 (배움님 신고)','',G('e-report'))}${mrow('로그아웃','',ACT('logout'))}${mrow('회원 탈퇴','',ACT('sheet','withdraw'),true)}</div></div>`+tabbar('friend','f-me'),role:'friend',tab:'f-me'});
P['f-guide']=()=>({html:`${topb()}${H('첫 수업은<br>이렇게 해요')}<div class="body">${['인사하고 오늘 배울 것을 함께 확인해요','배움님 휴대폰으로, 배움님 손으로 누르게 해요','한 단계씩, 같은 것을 여러 번 설명해요','끝나면 다음에 연습할 것을 코멘트로 남겨요'].map((t,i)=>`<div style="display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--grey2)"><b style="color:var(--action)">${i+1}</b>${fp(t)}</div>`).join('')}</div>${foot(btn('다 읽었어요',ACT('readGuide')))}`});
P['f-promise']=()=>({html:`${topb()}${H('배움님과의<br>약속 5가지','모두 확인해야 요청을 받을 수 있어요 ⭐')}<div class="body">${['비밀번호·인증번호를 대신 입력하지 않아요','현금이나 물건을 받지 않아요','배움님 개인정보를 사진으로 남기지 않아요','약속 시간에 늦으면 미리 전화해요','처음 만날 때는 공개된 장소를 권해요'].map(t=>`<label class="card" style="flex-direction:row;gap:12px;padding:14px;align-items:flex-start"><input type="checkbox" class="pr" ${S.friend.promise?'checked':''} style="width:22px;height:22px;margin-top:2px"> ${t}</label>`).join('')}</div>${foot(btn('약속할게요',ACT('promise')))}`});
P['f-cancel']=()=>{const b=factive();if(!b)return noBooking();return{html:`${topb()}${H('수업 취소 요청')}<div class="body"><div class="card">${row('배움님',S.senior.name)}${row('일시',when(b))}</div><div class="card y">${fp('확정된 수업을 프렌드가 취소하면 배움님께 전액 환불되고, 활동 기록에 남아요. 한 달에 2번 넘으면 운영팀이 연락드려요 ⭐')}</div>${['갑자기 일정이 생겼어요','몸이 좋지 않아요','기타'].map((t,i)=>`<label class="choice" style="display:flex;gap:10px;align-items:center;min-height:56px"><input type="radio" name="fc" ${i===0?'checked':''}> ${t}</label>`).join('')}</div>${foot(btn('취소 요청 보내기',ACT('friendCancel'),'red'))}`}};
P['f-noshow']=()=>{const b=factive();if(!b)return noBooking();return{html:`${topb()}${H('배움님이 안 나왔어요')}<div class="body"><div class="card">${row('배움님',S.senior.name)}${row('약속',when(b))}</div><div class="card y">${fp('<b>노쇼 처리 ⭐</b><br>· 약속 20분 뒤부터 누를 수 있어요<br>· 배움님과 자녀분께 확인 문자가 가요<br>· 확인되면 수업료의 50%를 정산해 드려요')}</div><label class="f">남길 말 (선택)<input class="inp" placeholder="전화를 두 번 드렸는데 안 받으셨어요"></label></div>${foot(btn('운영팀에 알리기',ACT('noShow')))}`}};
P['f-account']=()=>({html:`${topb()}${H('정산 계좌 바꾸기','예금주는 '+fname()+' 님과 같아야 해요')}<div class="body"><div class="grid2"><label class="f">은행<select class="inp" id="bank"><option>국민은행</option><option>신한은행</option><option>우리은행</option><option>하나은행</option></select></label><label class="f">계좌번호<input class="inp" inputmode="numeric"></label></div><p class="m" style="margin:0">바꾼 계좌는 다음 정산부터 적용돼요</p></div>${foot(btn('바꾸기',ACT('bank')))}`});

function cTop(active){const T=[['c-home','어머님 현황'],['c-report','성과 리포트'],['c-payments','결제 내역']];return `<div class="webtop">${markSVG(30)}<b>배프</b><nav style="display:flex;gap:6px;overflow-x:auto">${T.map(([p,l])=>`<button type="button" class="sbtn ${p===active?'soft':'sec'}" ${G(p)}>${l}</button>`).join('')}</nav><span class="m" style="margin-left:auto;font-size:14px;white-space:nowrap">${esc(S.child.name)} 님 (자녀)</span></div>`}

P['c-signup']=()=>({html:`${topb()}${H('부모님 정보를<br>알려 주세요','결제와 리포트는 자녀분(지금 휴대폰)이 받아요')}<div class="body"><label class="f">부모님 성함<input class="inp" data-bind="senior.name" value="${esc(S.senior.name)}"></label><label class="f">부모님 휴대폰<input class="inp" value="${S.senior.phone}"></label><label class="f">부모님 사시는 곳<input class="inp" data-bind="senior.addr" value="${esc(S.senior.addr)}"></label><label style="display:flex;gap:10px;align-items:flex-start;font-size:16px"><input type="checkbox" id="pagree" style="width:22px;height:22px"> 부모님께 신청 사실을 알리고 동의를 받았어요 (부모님 휴대폰으로 확인 문자가 가요)</label></div>${foot(btn('가입하고 배울 것 고르기',ACT('childSignup')))}`});
P['c-linkconfirm']=()=>({html:`${topb()}${H(`${esc(S.senior.name)} 님(어머님)과<br>연결할까요?`,'어머님이 배프에서 자녀분 번호를 등록하셨어요')}<div class="body"><div class="card">${fp('연결하면 이런 걸 받아요','m')}${fp('· 수업 결제 요청 문자<br>· 수업이 끝난 뒤 성과 리포트<br>· 수업 확정·취소 알림')}</div></div>${foot(btn('연결하기',ACT('childAccept'))+btn('제가 아니에요',G('w-landing'),'sec'))}`});
P['c-home']=()=>{const b=active();const done=S.bookings.filter(x=>x.status==='COMPLETED');
 return{wide:true,html:cTop('c-home')+`<div class="wrap"><h1 style="margin:0;font-size:26px">어머님(${esc(S.senior.name)} 님) 배움 현황</h1><div class="cols"><div class="wcard"><b>다음 수업</b>${b?`<div style="display:flex;gap:14px;align-items:center">${av(FR(b.friend).l,52,FR(b.friend).color)}<div style="flex:1"><b style="font-size:19px">${when(b)}</b><br><span class="m">${FR(b.friend).name} 프렌드 · ${placeName(b)} · ${b.topics.join(', ')}</span></div>${badge(b.status==='ACCEPTED'?'결제 필요':STATUS_KO[b.status],b.status==='ACCEPTED'?'wait':'ok')}</div>${b.status==='ACCEPTED'?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="sbtn" ${G('c-pay')}>${won(fee(b))} 결제하기</button><button type="button" class="sbtn sec" ${G('s-friend',{id:b.friend})}>프렌드 정보</button></div><span class="notice">결제 기한: 수락 후 24시간 안 (늦어도 수업 24시간 전까지) ⭐</span>`:''}`:`<p class="m" style="margin:0">예약된 수업이 없어요</p><button type="button" class="sbtn" style="align-self:flex-start" ${ACT('childBook')}>어머님 수업 예약해 드리기</button>`}</div><div class="wcard"><b>지금까지</b><div style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center">${[[done.length+'번','수업'],[Object.values(S.practice).filter(p=>p.pct>=60).length+'개','혼자 함'],[Object.values(S.practice).reduce((a,p)=>a+p.count,0)+'번','연습']].map(([a,c])=>`<div><b style="font-size:24px">${a}</b><br><span class="m" style="font-size:13px">${c}</span></div>`).join('')}</div></div></div><div class="wcard"><div style="display:flex;justify-content:space-between"><b>최근 성과 리포트</b><button type="button" class="link" ${G('c-report')}>보기 ›</button></div><table><thead><tr><th>날짜</th><th>프렌드</th><th>배운 것</th><th>프렌드 메모</th></tr></thead><tbody>${done.filter(x=>x.comment).reverse().map(x=>`<tr><td>11.${x.day}</td><td>${FR(x.friend).name}</td><td>${x.topics.join(', ')}</td><td>${esc(x.comment.next)}</td></tr>`).join('')||'<tr><td colspan="4" class="m">아직 리포트가 없어요</td></tr>'}</tbody></table></div><button type="button" class="link" ${G('s-sms')}>자녀 휴대폰에 간 문자 보기 P['c-pay']=()=>{const b=active();if(!b||b.status!=='ACCEPTED')return P['c-home']();const f=FR(b.friend);
 return{wide:true,html:cTop('c-payments')+`<div class="wrap"><h1 style="margin:0;font-size:26px">어머님 수업 결제</h1><div class="cols"><div class="wcard"><b>수업 정보</b><div style="display:flex;gap:14px;align-items:center">${av(f.l,52,f.color)}<div><b>${f.name} 프렌드</b><br><span class="m">${f.school} · 재학 확인 · 후기 ${f.stars} (${f.reviews})</span></div></div>${row('일시',when(b))}${row('장소','어머님 댁')}${row('배울 것',b.topics.join(', '))}</div><div class="wcard"><b>결제</b><div class="chips"><button type="button" class="chip on">카카오페이</button><button type="button" class="chip">토스페이</button><button type="button" class="chip">신용·체크카드</button></div>${row('수업료',won(fee(b)))}<span class="m" style="font-size:13px">하루 전까지 전액 환불 ⭐ <a href="#" ${G('l-refund')}>환불 규정</a></span><button type="button" class="sbtn" style="min-height:52px" ${ACT('pay','child')}>${won(fee(b))} 결제하기</button><button type="button" class="link" ${G('c-payfail')}>결제가 실패하면? (시연)</button></div></div></div>`,role:'child'}};
P['c-payfail']=()=>({html:`${topb()}<div class="body">${center('!','#FDECEC','결제가 안 됐어요','카드 한도가 부족하거나<br>결제 창이 닫혔어요')}</div>${foot(btn('다시 결제하기',G('c-pay'))+btn('다른 방법으로 결제',G('c-pay'),'sec'))}`,role:'child'});
P['c-paid']=()=>({html:`${topb(false,' ')}<div class="body">${center('✓','var(--green)','결제가 끝났어요','어머님 휴대폰으로 확정 문자를 보냈어요')}<div class="card y">${fp('수업이 끝나면 <b>성과 리포트</b>를 문자로 보내드려요.')}</div></div>${foot(btn('자녀 홈으로',G('c-home')))}`,role:'child'});
P['c-report']=()=>{const b=S.bookings.filter(x=>x.comment).slice(-1)[0];if(!b)return{wide:true,html:cTop('c-report')+'<div class="wrap"><p class="m">아직 리포트가 없어요. 수업 후 프렌드가 코멘트를 남기면 생겨요.</p></div>',role:'child'};const tp=S.practice.taxi;
 return{wide:true,html:cTop('c-report')+`<div class="wrap"><div><span class="m">${when(b)} · ${FR(b.friend).name} 프렌드 · ${b.dur===60?'1시간':'1시간 30분'}</span><h1 style="margin:6px 0 0;font-size:26px">어머님이 오늘 이만큼 배우셨어요</h1></div><div class="cols eq"><div class="wcard" style="background:var(--soft)"><span class="m" style="font-weight:700">프렌드 메모</span><b style="font-size:20px">${esc(b.comment.next)}</b>${b.comment.msg?`<span>"${esc(b.comment.msg)}"</span>`:''}</div><div class="wcard"><b>배운 것과 숙지도</b>${b.topics.map(t=>{const m=b.comment.mastery?.[t]||'도움 받으면 함';const pct={'처음':20,'도움 받으면 함':50,'혼자 함':85}[m];return `<div>${row(t,m)}<span class="bar"><i style="width:${pct}%"></i></span></div>`}).join('')}${row('택시 혼자 연습',`${tp.count}번 · 숙지도 ${tp.pct}%`)}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="sbtn" ${ACT('childBook')}>다음 수업 예약해 드리기</button><button type="button" class="sbtn sec" ${ACT('toast','링크를 복사했어요 (시연)')}>리포트 링크 복사</button><button type="button" class="sbtn sec" ${G('e-report')}>불편 알리기</button></div></div>`,role:'child'}};
P['c-payments']=()=>({wide:true,html:cTop('c-payments')+`<div class="wrap"><h1 style="margin:0;font-size:26px">결제 내역 · 환불</h1><div class="wcard"><table><thead><tr><th>수업</th><th>프렌드</th><th>금액</th><th>상태</th><th></th></tr></thead><tbody>${S.bookings.slice().reverse().map(b=>`<tr><td>${when(b)}</td><td>${FR(b.friend).name}</td><td>${['ACCEPTED','REQUESTED','DECLINED','EXPIRED_NO_RESPONSE','EXPIRED_NO_PAYMENT'].includes(b.status)?'—':won(fee(b))}${b.refund?` <span class="m">(환불 ${won(b.refund)})</span>`:''}</td><td>${badge(STATUS_KO[b.status],b.status==='CONFIRMED'?'ok':b.status==='COMPLETED'?'done':ENDED.includes(b.status)?'cancel':'wait')}</td><td>${b.status==='CONFIRMED'?`<button type="button" class="sbtn danger" ${G('s-cancel')}>취소·환불</button>`:b.status==='ACCEPTED'?`<button type="button" class="sbtn" ${G('c-pay')}>결제</button>`:''}</td></tr>`).join('')}</tbody></table><span class="m" style="font-size:13px">하루 전까지 전액, 당일 50% 환불 ⭐</span></div></div>`,role:'child'});

 const nav=ADM.map(([p,l])=>`<button type="button" class="${p===active?'on':''} sbtn ${p===active?'soft':'sec'}" ${G(p)}>${l}${cnt[p]?` <span class="badge b-cancel" style="font-size:12px;padding:0 8px">${cnt[p]}</span>`:''}</button>`).join('');
 return{wide:true,role:'admin',html:`<div class="adm"><aside><div style="display:flex;gap:8px;align-items:center;padding:0 8px 18px">${markSVG(28)}<b>배프 운영</b></div>${nav}<p class="m" style="margin-top:auto;font-size:12px;padding:0 8px">운영자 계정 · 2단계 인증 · 모든 행동 기록</p></aside><div><div class="admnav">${nav}</div><div class="wrap"><h1 style="margin:0;font-size:24px">${title}</h1>${inner}</div></div></div>`}}
P['a-login']=()=>({wide:true,html:`<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="wcard" style="width:100%;max-width:400px"><div>${markSVG(30)} <b>배프 운영</b></div><h1 style="margin:6px 0 0;font-size:24px">운영자 로그인</h1><label class="f">아이디<input class="inp" autocomplete="off"></label><label class="f">비밀번호<input class="inp" type="password" autocomplete="off"></label><label class="f">2단계 인증 (휴대폰 6자리)<input class="inp" inputmode="numeric" maxlength="6"></label><button type="button" class="sbtn" style="min-height:52px" ${ACT('adminLogin')}>로그인 (시연: 아무 값)</button><p class="m" style="margin:0;font-size:13px">로그인 기록이 남아요 · 30분 동안 안 쓰면 로그아웃</p></div></div>`});
P['a-dash']=()=>{const pay=S.bookings.filter(b=>b.status==='ACCEPTED').length;return adm('a-dash','오늘 할 일',`<div class="kpis">${[[S.applicants.length+(S.friend.status==='pending'?1:0)+'명','승인 대기'],[S.reports.filter(r=>r.status==='확인 전').length+'건','새 신고'],[pay+'건','결제 기다림'],[won(settleTotal()),'이번 주 입금할 금액']].map(([a,b])=>`<div class="kpi"><span class="m">${b}</span><b>${a}</b></div>`).join('')}</div><div class="cols"><div class="wcard"><b>처리할 일 (오래 기다린 순)</b>${[...(S.friend.status==='pending'?[['승인','wait',S.friend.name+' · 경희대','a-approve']]:[]),...S.applicants.map(a=>['승인','wait',a.name+' · '+a.school.split(' ')[0],'a-approve']),...S.reports.filter(r=>r.status==='확인 전').map(r=>['신고','cancel',r.target+' · '+r.reason,'a-reports']),...S.bookings.filter(b=>b.status==='NO_SHOW').map(b=>['노쇼','cancel',S.senior.name+' 배움님 · '+when(b),'a-reports'])].map(([k,c,t,p])=>`<button type="button" class="mrow" style="font-size:15px" ${G(p)}>${badge(k,c)} ${t}<span>›</span></button>`).join('')||'<p class="m">처리할 일이 없어요</p>'}</div><div class="wcard"><b>앱 불편 의견</b>${S.feedback.slice(0,3).map(f=>`<p style="margin:0">${f.text}<br><span class="m" style="font-size:13px">${f.who} · ${f.date}</span></p>`).join('')}</div></div>`)};
P['a-approve']=()=>{const all=[...(S.friend.status==='pending'?[{id:'me',name:S.friend.name,age:22,school:'경희대 산업공학과 3학년',radius:'영통구 3km',time:'토·일',topics:'택시, 키오스크, 카톡',date:'오늘'}]:[]),...S.applicants];const sel=all.find(a=>a.id===S.params.id)||all[0];
 return adm('a-approve','프렌드 가입 승인',all.length?`<div class="cols l"><div class="wcard"><b>승인 대기 ${all.length}명</b>${all.map(a=>`<button type="button" class="mrow" style="font-size:15px;${a===sel?'color:var(--action)':''}" ${G('a-approve',{id:a.id})}>${a.name}<span>${a.school.split(' ')[0]} · ${a.date}</span></button>`).join('')}</div><div class="wcard"><b style="font-size:19px">${sel.name} · ${sel.age}세</b>${row('학교',sel.school)}${row('활동 반경',sel.radius)}${row('가능한 시간',sel.time)}${row('가르칠 것',sel.topics)}${row('휴대폰 인증','완료')}${row('정산 계좌','예금주 일치')}<div style="display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:var(--sub)"><span style="width:110px;height:76px;border-radius:8px;background:var(--grey2);display:flex;align-items:center;justify-content:center;font-size:13px" class="m">재학증명서</span><span>재학증명서 · 2026.11.02 발급</span></div><span class="notice">안전 확인 서류 칸: 팀 확정 후 추가</span><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="sbtn danger" ${ACT('approve',{id:sel.id,ok:false})}>반려 (사진 불분명)</button><button type="button" class="sbtn" ${ACT('approve',{id:sel.id,ok:true})}>승인하고 문자 보내기</button></div></div></div>`:'<div class="wcard"><p class="m">승인 대기가 없어요</p></div>')};
P['a-reports']=()=>{const ns=S.bookings.filter(b=>b.status==='NO_SHOW'&&!b.nsDone);return adm('a-reports','후기 · 신고',`<div class="wcard"><table><thead><tr><th>날짜</th><th>대상</th><th>신고한 사람</th><th>이유</th><th>상태</th><th></th></tr></thead><tbody>${S.reports.map(r=>`<tr><td>${r.date}</td><td>${r.target}</td><td>${r.by}</td><td>${esc(r.reason)}<br><span class="m" style="font-size:13px">${esc(r.text||'')}</span></td><td>${badge(r.status,r.status==='확인 전'?'wait':'done')}</td><td>${r.status==='확인 전'?`<div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="sbtn sec" ${ACT('handleReport',{id:r.id,a:'ok'})}>문제 없음</button><button type="button" class="sbtn soft" ${ACT('handleReport',{id:r.id,a:'warn'})}>경고</button><button type="button" class="sbtn danger" ${ACT('handleReport',{id:r.id,a:'limit'})}>활동 제한</button></div>`:''}</td></tr>`).join('')}</tbody></table></div>${ns.length?`<div class="wcard"><b>노쇼 확인</b>${ns.map(b=>`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><span>${when(b)} · ${S.senior.name} 배움님 / ${FR(b.friend).name} 프렌드</span><span style="display:flex;gap:6px"><button type="button" class="sbtn sec" ${ACT('noShowCheck',{id:b.id,ok:false})}>노쇼 아님</button><button type="button" class="sbtn" ${ACT('noShowCheck',{id:b.id,ok:true})}>노쇼 확인 (프렌드 50%)</button></span></div>`).join('')}</div>`:''}<div class="wcard"><b>받은 후기</b>${S.bookings.filter(b=>b.review).map(b=>`<p style="margin:0">${'★'.repeat(b.review.stars)} · ${FR(b.friend).name} 프렌드 · ${b.review.tags.join(', ')} ${b.review.text?'· "'+esc(b.review.text)+'"':''}</p>`).join('')||'<p class="m">아직 없어요</p>'}</div>`)};
P['a-settle']=()=>{const items=S.bookings.filter(b=>(b.status==='COMPLETED'&&b.comment)||b.status==='NO_SHOW'&&b.nsDone);return adm('a-settle','정산',`<div class="kpis"><div class="kpi"><span class="m">입금할 금액</span><b>${won(settleTotal())}</b></div><div class="kpi"><span class="m">수수료 수입 (10% ⭐)</span><b>${won(items.reduce((a,b)=>a+fee(b)*.1,0))}</b></div></div><div class="wcard"><table><thead><tr><th>수업</th><th>프렌드</th><th>받을 금액</th><th>계좌</th><th>상태</th></tr></thead><tbody>${items.map(b=>`<tr><td>${when(b)}</td><td>${FR(b.friend).name}</td><td>${won(b.status==='NO_SHOW'?fee(b)*.5:fee(b)*.9)}</td><td>${S.friend.bank}</td><td>${badge(b.settled||'입금 예정',b.settled==='입금 완료'?'done':'wait')}</td></tr>`).join('')}</tbody></table><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><span class="m" style="font-size:13px">입금 완료를 누르면 프렌드에게 문자가 가요 · 세금 3.3% 처리는 팀 확정 전</span><button type="button" class="sbtn" ${ACT('payout')}>입금 예정 전부 입금 완료</button></div></div>`)};
P['a-payments']=()=>adm('a-payments','결제 · 환불',`<div class="wcard"><table><thead><tr><th>수업</th><th>결제한 사람</th><th>금액</th><th>상태</th><th>환불</th></tr></thead><tbody>${S.bookings.filter(b=>b.paidBy).map(b=>`<tr><td>${when(b)}</td><td>${b.paidBy==='child'?S.child.name+' (자녀)':S.senior.name+' (배움님)'}</td><td>${won(fee(b))}</td><td>${badge(STATUS_KO[b.status],ENDED.includes(b.status)?'cancel':'done')}</td><td>${b.refund?won(b.refund):'—'}</td></tr>`).join('')}</tbody></table></div>`);
P['a-sms']=()=>adm('a-sms','문자 기록',`<div class="wcard"><table><thead><tr><th>보낸 시각</th><th>받는 사람</th><th>종류</th><th>내용</th><th>결과</th></tr></thead><tbody>${S.sms.map(m=>`<tr><td>${m.at}</td><td>${m.to}</td><td>${m.kind}</td><td>${esc(m.text.slice(0,40))}…</td><td>${badge(m.ok?'전송됨':'실패','done')}</td></tr>`).join('')||'<tr><td colspan="5" class="m">아직 보낸 문자가 없어요</td></tr>'}</tbody></table><span class="m" style="font-size:13px">전화번호 가운데 자리는 가려서 보여줘요 · 보관 기간 팀 확정 전</span></div>`);
P['a-feedback']=()=>adm('a-feedback','의견함',`<div class="wcard"><table><thead><tr><th>날짜</th><th>보낸 사람</th><th>화면</th><th>내용</th><th>상태</th></tr></thead><tbody>${S.feedback.map((f,i)=>`<tr><td>${f.date}</td><td>${f.who}</td><td>${f.screen}</td><td>${esc(f.text)}</td><td>${f.status==='확인 전'?`<button type="button" class="sbtn soft" ${ACT('fbDone',i)}>확인함</button>`:badge(f.status,'done')}</td></tr>`).join('')}</tbody></table></div>`);
P['a-members']=()=>adm('a-members','회원 관리',`<div class="wcard"><table><thead><tr><th>이름</th><th>역할</th><th>휴대폰</th><th>연결</th><th>상태</th></tr></thead><tbody><tr><td>${esc(S.senior.name)}</td><td>배움님</td><td>010-****-5678</td><td>${S.senior.childLinked?'자녀 '+esc(S.child.name):'—'}</td><td>${badge('활동','done')}</td></tr><tr><td>${esc(S.child.name)}</td><td>자녀</td><td>010-****-5432</td><td>${S.senior.childLinked?'부모님 '+esc(S.senior.name):'—'}</td><td>${badge('활동','done')}</td></tr><tr><td>${esc(S.friend.name)}</td><td>프렌드</td><td>010-****-1234</td><td>—</td><td>${badge({approved:'활동',pending:'승인 대기',rejected:'반려',restricted:'활동 제한'}[S.friend.status]+(S.friend.warnings?` · 경고 ${S.friend.warnings}`:''),S.friend.status==='approved'?'done':'wait')}</td></tr></tbody></table><span class="m" style="font-size:13px">전체 번호 보기는 기록이 남아요</span></div>`);

P['w-landing']=()=>({wide:true,html:`<div class="webtop">${markSVG(32)}<b style="font-size:18px">배프</b><span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="sbtn sec" ${G('s-login')}>로그인</button><button type="button" class="sbtn" ${G('s-login')}>시작하기</button></span></div><div style="background:#fff"><div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:center;padding-top:48px;padding-bottom:48px"><div style="display:flex;flex-direction:column;gap:16px"><h1 style="margin:0;font-size:clamp(30px,4vw,44px);line-height:1.3;letter-spacing:-1px">부모님 스마트폰,<br>동네 대학생이<br>천천히 알려드려요</h1><p class="t m">택시 부르기, 키오스크 주문, 병원 예약까지. 1:1로 찾아가고, 집에서 연습하고, 끝나면 자녀분께 성과 리포트를 보내드려요.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="sbtn" style="min-height:52px" ${ACT('startAs','child')}>부모님 수업 신청하기</button><button type="button" class="sbtn soft" style="min-height:52px" ${ACT('startAs','friend')}>프렌드로 활동하기</button><button type="button" class="sbtn sec" style="min-height:52px" ${G('s-login')}>제가 배울게요</button></div></div><div style="position:relative;height:280px">${orbs(10,10,1.2)}</div></div></div><div class="wrap"><h2 style="margin:0">이렇게 진행돼요</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">${[['배울 것 고르기','택시, 키오스크 등'],['프렌드 고르기','재학 확인된 동네 대학생'],['자녀분이 결제','문자 링크로 간편하게'],['수업과 리포트','집 연습 + 성과 리포트']].map(([t,d],i)=>`<div class="wcard"><b style="color:var(--action)">${i+1}</b><b style="font-size:18px">${t}</b><span class="m">${d}</span></div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px"><div class="wcard"><span class="m">수업료</span><b style="font-size:20px">1시간 20,000원 · 1시간 30분 25,000원</b><span class="m" style="font-size:14px">모든 프렌드 같은 금액 · 하루 전까지 전액 환불 ⭐</span></div><div class="wcard"><span class="m">지금은</span><b style="font-size:20px">수원 영통동·서천동에서 시작해요</b><span class="m" style="font-size:14px">다른 동네는 알림 신청을 남겨 주세요</span></div></div></div>${webFoot}`});

P['l-terms']=legal('이용약관',[['서비스 내용','배움님·자녀·프렌드·배프의 역할'],['회원 가입과 탈퇴','휴대폰 인증, 자녀 대리 가입'],['예약·결제·취소','시간 규칙과 환불 규정 연결'],['금지 행동','대신 입력, 현금 거래, 개인정보 촬영'],['책임과 분쟁','사고·분실 시 처리, 고객센터']]);

/* ---------- 동작 ---------- */
const HOME={guest:'w-landing',senior:'s-home',friend:'f-home',child:'c-home',admin:'a-dash'};
function go(p,args){S.back.push([S.page,S.params]);if(S.back.length>30)S.back.shift();S.page=p;S.params=args||{};save();render();window.scrollTo(0,0)}
function sheet(html){const d=document.createElement('div');d.className='sheetbg';d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)d.remove()});document.body.appendChild(d);d.querySelector('button')?.focus()}
const closeSheet=()=>document.querySelector('.sheetbg')?.remove();
function setRole(r,page){S.role=r;S.back=[];S.page=page||HOME[r];S.params={};save();render()}

 decline(){const r=document.querySelector('input[name=dr]:checked')?.value;closeSheet();const b=fcur();b.status='DECLINED';b.reason=r;notify('senior','다른 프렌드를 찾아 주세요',`이유: ${r}`);sms(S.senior.name+' 010-****-5678','senior','거절',`[배프] 이번 시간은 어렵대요 (${r}). 다른 프렌드를 찾아 보세요.`);toast('거절했어요');render()},

 adminLogin(){setRole('admin')},

  if(k==='reset'){S=fresh();save();render();toast('처음 상태로 되돌렸어요');return}
  if(!b){toast('먼저 예약을 만들어 주세요');return}
  if(k==='noresp'&&b.status==='REQUESTED'){b.status='EXPIRED_NO_RESPONSE';notify('senior','다른 프렌드를 찾아 주세요','응답 시간이 지났어요')}

  else if(k==='today'&&b.status==='CONFIRMED'){b.today=true;sms(S.senior.name+' 010-****-5678','senior','수업 1시간 전',`[배프] 오늘 ${tlabel(b.time)}에 프렌드가 와요.`)}
  else if(k==='end'&&b.status==='CONFIRMED'){b.status='COMPLETED';b.today=false;notify('senior','수업을 마쳤어요','후기를 남겨 주세요')}

lock;height:100%;width:0;background:#1F5BD8;border-radius:4px}\n  .bar.on i{width:100%;transition:width var(--wait,1.2s) linear}\n  .fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s ease}\n  .fade.on{opacity:1}\n  .next{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;background:#fff;color:#191F28}\n  .next.on{display:flex}.next b{font-size:22px}.next p{margin:0;color:#6B7684;font-size:15px;line-height:1.6}\n  .next button,.modes button{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid #D1D6DB;background:#fff;color:#191F28;font:600 16px 'Noto Sans KR',sans-serif;cursor:pointer}\n  .next button.pri{background:#1F5BD8;border-color:#1F5BD8;color:#fff}\n  .modes{display:flex;gap:6px;background:#fff;padding:5px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}\n  .modes button{min-height:40px;border:none;font-size:14px;color:#6B7684}.modes button.on{background:#191F28;color:#fff}\n  .tip{position:absolute;top:20px;left:0;right:0;text-align:center;font-size:13px;color:#8B95A1;pointer-events:none;display:none}.play .tip{display:block}\n  .flat{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);width:250px;height:140px;display:none}\n  .flat.on{display:block}\n  .flat .fb,.flat .fy,.flat .syn,.flat .face,.flat .sh{transform-box:fill-box;transform-origin:center}\n  .flat.on .fb{animation:inL 1s cubic-bezier(.2,.8,.25,1) both}\n  .flat.on .fy{animation:inR 1s cubic-bezier(.2,.8,.25,1) both}\n  .flat.on .sh{animation:fin .8s ease .3s both}\n  .flat.on .syn{animation:fin .35s ease .95s both}\n  .flat.on .face{animation:popf .5s cubic-bezier(.3,1.6,.5,1) 1.1s both}\n  .flat.idle{animation:float 3s ease-in-out infinite}\n  @keyframes inL{from{transform:translateX(-170px) rotate(-200deg)}to{transform:none}}\n  @keyframes inR{from{transform:translateX(170px) rotate(200deg)}to{transform:none}}\n  @keyframes fin{from{opacity:0}}\n  @keyframes popf{from{opacity:0;transform:scale(.2)}}\n  @keyframes float{50%{transform:translate(-50%,calc(-50% - 5px))}}\n  @media (max-width:500px){body{display:block}.phone{width:100vw;height:100vh;max-height:none;border-radius:0;box-shadow:none}.modes{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:5;opacity:.9}}\n  @media (prefers-reduced-motion:reduce){.copy,.bar i,.fade{transition:none}.flat *{animation:none!important}}\n</style>\n<style>\nhtml.embed,html.embed body{background:transparent!important;display:block;height:100%}\nhtml.embed .modes,html.embed .bar,html.embed .next,html.embed .fade,html.embed .foot,html.embed .tip{display:none!important}\nhtml.embed .phone{width:100%!important;height:100%!important;max-height:none!important;border-radius:0!important;box-shadow:none!important;background:transparent!important}\nhtml.embed .copy{top:60%;bottom:auto}\nhtml.embed .flat{top:34%}\nhtml.embed #stage{cursor:grab}\n</style>\n</head>\n<body>\n<div class=\"modes\" role=\"group\" aria-label=\"미리보기 종류\"><button type=\"button\" id=\"mApp\" class=\"on\">앱 첫 화면</button><button type=\"button\" id=\"mPlay\">놀이 버전 (소개 페이지용)</button></div>\n<div class=\"phone\" id=\"phone\">\n  <canvas id=\"stage\" aria-label=\"파란 구슬과 노란 구슬이 만나 겹친 부분에 웃는 얼굴이 생기는 배프 3D 로고\"></canvas>\n  <svg class=\"flat\" id=\"flat\" viewBox=\"0 0 250 150\" aria-hidden=\"true\"><defs><radialGradient id=\"gb\" cx=\"38%\" cy=\"32%\" r=\"70%\"><stop offset=\"0\" stop-color=\"#6FA1F2\"/><stop offset=\"1\" stop-color=\"#2F72E6\"/></radialGradient><radialGradient id=\"gy\" cx=\"38%\" cy=\"32%\" r=\"70%\"><stop offset=\"0\" stop-color=\"#FFD25E\"/><stop offset=\"1\" stop-color=\"#FFB21E\"/></radialGradient><radialGradient id=\"gs\" cx=\"50%\" cy=\"50%\" r=\"60%\"><stop offset=\"0\" stop-color=\"#191F28\" stop-opacity=\".16\"/><stop offset=\"1\" stop-color=\"#191F28\" stop-opacity=\"0\"/></radialGradient><clipPath id=\"cb\"><circle cx=\"97\" cy=\"68\" r=\"58\"/></clipPath></defs>\n<ellipse class=\"sh\" cx=\"125\" cy=\"136\" rx=\"95\" ry=\"9\" fill=\"url(#gs)\"/>\n<g class=\"fb\"><circle cx=\"97\" cy=\"68\" r=\"58\" fill=\"url(#gb)\"/></g>\n<g class=\"fy\"><circle cx=\"153\" cy=\"68\" r=\"58\" fill=\"url(#gy)\"/></g>\n<g class=\"syn\"><circle cx=\"153\" cy=\"68\" r=\"58\" fill=\"#35B874\" clip-path=\"url(#cb)\"/></g>\n<g class=\"face\"><circle cx=\"115\" cy=\"64\" r=\"4.3\" fill=\"#1E2833\"/><circle cx=\"135\" cy=\"64\" r=\"4.3\" fill=\"#1E2833\"/><path d=\"M116.5 75q4.25 5 8.5 0q4.25 5 8.5 0\" fill=\"none\" stroke=\"#1E2833\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"106\" cy=\"76\" rx=\"6\" ry=\"3.5\" fill=\"#FF8C96\" opacity=\".45\"/><ellipse cx=\"144\" cy=\"76\" rx=\"6\" ry=\"3.5\" fill=\"#FF8C96\" opacity=\".45\"/></g></svg>\n  <div class=\"tip\">끌어서 돌리기 · 한 번 누르면 깜짝 · 두 번 누르면 통통</div>\n  <div class=\"copy\" id=\"copy\"><h1>배프</h1><p>배움을 함께하는 프렌드</p></div>\n  <div class=\"foot\" id=\"foot\">어르신과 동네 대학생, 함께 배우는 시간</div>\n  <div class=\"bar\" id=\"bar\"><i></i></div>\n  <div class=\"fade\" id=\"fade\"></div>\n  <div class=\"next\" id=\"next\"><b>여기서 소개 화면으로 넘어가요</b><p>실제 앱에서는 이 자리에 소개 → 로그인 화면이 이어져요.<br>(미리보기라 여기서 멈췄어요)</p><button type=\"button\" class=\"pri\" id=\"again\">처음부터 다시 보기</button></div>\n</div>\n\n<script>document.documentElement.classList.add(\"embed\");<\/script>\n<script>\n/* 미리보기 모드 · 자동 넘어가기 · 3D 실패 시 평면 그림 */\nwindow.BP=(function(){\n  const phone=document.getElementById('phone'),copy=document.getElementById('copy'),foot=document.getElementById('foot'),bar=document.getElementById('bar'),fade=document.getElementById('fade'),next=document.getElementById('next');\n  const o={play:location.hash==='#play',listeners:[]};\n  function setMode(p){o.play=p;phone.classList.toggle('play',p);document.getElementById('mApp').classList.toggle('on',!p);document.getElementById('mPlay').classList.toggle('on',p);history.replaceState(null,'',p?'#play':'#');o.restart()}\n  o.showText=()=>{copy.classList.add('on');foot.classList.add('on')};\n  o.armNext=()=>{return;if(o.play||o.armed)return;o.armed=true;bar.style.setProperty('--wait','1.1s');bar.classList.add('on');o.timer=setTimeout(o.goNext,1150)};\n  o.goNext=()=>{return;if(o.play||o.gone)return;o.gone=true;clearTimeout(o.timer);fade.classList.add('on');setTimeout(()=>{next.classList.add('on');try{parent.postMessage({baepu:'splash-done'},'*')}catch(e){}},450)};\n  o.restart=()=>{clearTimeout(o.timer);o.armed=o.gone=false;[copy,foot,bar,fade,next].forEach(e=>e.classList.remove('on'));o.listeners.forEach(f=>f())};\n  document.getElementById('mApp').onclick=()=>setMode(false);\n  document.getElementById('mPlay').onclick=()=>setMode(true);\n  document.getElementById('again').onclick=()=>o.restart();\n  phone.classList.toggle('play',o.play);document.getElementById('mApp').classList.toggle('on',!o.play);document.getElementById('mPlay').classList.toggle('on',o.play);\n  o.flat=()=>{const f=document.getElementById('flat');document.getElementById('stage').style.display='none';const run=()=>{f.classList.remove('on');void f.offsetWidth;f.classList.add('on');setTimeout(o.showText,1500);setTimeout(o.armNext,1900)};o.listeners.push(run);run();phone.addEventListener('click',e=>{if(!e.target.closest('button'))o.goNext()})};\n  return o})();\n<\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n(function(){\n  if(!window.THREE){BP.flat();return;}\n  const phone=document.getElementById('phone'), canvas=document.getElementById('stage');\n  const copy=document.getElementById('copy'), foot=document.getElementById('foot');\n  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  // ---------- renderer / scene ----------\n  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,3));\n  renderer.outputEncoding=THREE.sRGBEncoding;\n  renderer.toneMapping=THREE.ACESFilmicToneMapping;\n  renderer.toneMappingExposure=1.0;\n  const scene=new THREE.Scene();\n  const camera=new THREE.PerspectiveCamera(30,1,0.1,100);\n  camera.position.set(0,0.35,13.5);\n  camera.lookAt(0,0.15,0);\n\n  // soft studio environment for glossy reflections (kept dim so colours stay rich)\n  (function(){\n    const envScene=new THREE.Scene();\n    const c=document.createElement('canvas');c.width=16;c.height=256;\n    const x=c.getContext('2d');const gr=x.createLinearGradient(0,0,0,256);\n    gr.addColorStop(0,'#ffffff');gr.addColorStop(.35,'#f4f6f9');gr.addColorStop(.7,'#dfe4ec');gr.addColorStop(1,'#cfd6e0');\n    x.fillStyle=gr;x.fillRect(0,0,16,256);\n    const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;\n    envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16),new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide})));\n    const card=new THREE.Mesh(new THREE.PlaneGeometry(5,2.4),new THREE.MeshBasicMaterial({color:0xffffff}));\n    card.position.set(-4,5,3);card.lookAt(0,0,0);envScene.add(card);\n    const strip=new THREE.Mesh(new THREE.PlaneGeometry(1.2,6),new THREE.MeshBasicMaterial({color:0xf2f4f7}));\n    strip.position.set(5,1,2);strip.lookAt(0,0,0);envScene.add(strip);\n    const pm=new THREE.PMREMGenerator(renderer);\n    scene.environment=pm.fromScene(envScene,0.04).texture;\n  })();\n  scene.add(new THREE.HemisphereLight(0xffffff,0xb8c2d0,0.22));\n  const key=new THREE.DirectionalLight(0xffffff,1.25);key.position.set(-3,4,5);scene.add(key);\n  const rim=new THREE.DirectionalLight(0xffffff,0.3);rim.position.set(3,1.5,-4);scene.add(rim);\n  const warm=new THREE.PointLight(0xffe7c4,0.15,20);warm.position.set(3,-1,4);scene.add(warm);\n  const sparkle=new THREE.PointLight(0xffffff,0.0,12);sparkle.position.set(-1.6,2.6,4.2);scene.add(sparkle);\n\n  // ---------- spheres: two different colours, a third \"synergy\" colour where they overlap ----------\n  const R=1, GAP=0.44, Y0=0.75;\n  const BLUE=0x2F72E6, YELLOW=0xFFB21E, SYN=new THREE.Color(0x35B874);   // sky blue + sunny yellow -> fresh green\n  const root=new THREE.Group();scene.add(root);\n  const geo=new THREE.SphereGeometry(R,128,96);\n\n  // Each sphere = an opaque body + a \"glass\" patch. Where the view ray also passes through the partner sphere,\n  // the front-most surface becomes see-through, so the overlap looks translucent and shows the green \"synergy\" inside.\n  function sphereMaterial(hex,glass,uOther){\n    const m=new THREE.MeshPhysicalMaterial({color:hex,roughness:glass?.25:.45,metalness:0,clearcoat:.35,clearcoatRoughness:glass?.2:.3,\n      envMapIntensity:glass?.22:.15,transparent:glass,depthWrite:!glass});\n    const rimCol=hex===BLUE?new THREE.Color(0.78,0.92,1.0):new THREE.Color(1.0,0.95,0.72);\n    m.customProgramCacheKey=()=>glass?'baepu-glass':'baepu-solid';\n    m.onBeforeCompile=sh=>{\n      sh.uniforms.uOther=uOther; sh.uniforms.uR={value:R}; sh.uniforms.uSyn={value:SYN}; sh.uniforms.uRim={value:rimCol};\n      sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\\nvarying vec3 vWPos;')\n        .replace('#include <project_vertex>','#include <project_vertex>\\nvWPos=(modelMatrix*vec4(transformed,1.0)).xyz;');\n      sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\\nvarying vec3 vWPos;\\nuniform vec3 uOther;\\nuniform float uR;\\nuniform vec3 uSyn;\\nuniform vec3 uRim;')\n        .replace('#include <color_fragment>',`#include <color_fragment>\n          vec3 rd=normalize(vWPos-cameraPosition);\n          vec3 oc=cameraPosition-uOther;\n          float bq=dot(oc,rd), disc=bq*bq-(dot(oc,oc)-uR*uR);\n          float tThis=length(vWPos-cameraPosition);\n          float tEnter=disc>0.0?(-bq-sqrt(max(disc,0.0))):1e9;\n          float inLens=disc>0.0?1.0:0.0;\n          float isFront=(inLens>0.5&&tThis<tEnter)?1.0:0.0;\n          float isInner=(inLens>0.5&&tThis>=tEnter)?1.0:0.0;\n          float edge=smoothstep(0.0,0.14,disc);\n          ${glass?\n            'if(isFront<0.5) discard;\\n diffuseColor.rgb=mix(diffuseColor.rgb,uSyn,0.35*edge);\\n diffuseColor.a=mix(1.0,0.42,edge);':\n            'if(isFront>0.5&&edge>0.6) discard;\\n diffuseColor.rgb=mix(diffuseColor.rgb,uSyn,isInner*0.85*smoothstep(0.0,0.08,disc));'}\n          float synGlow=isInner;`)\n        .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\\ntotalEmissiveRadiance+=uSyn*0.25*synGlow;')\n        .replace(/gl_FragColor\\s*=\\s*vec4\\(\\s*outgoingLight,\\s*diffuseColor\\.a\\s*\\);/,\n          `float fres=pow(1.0-clamp(dot(normalize(normal),normalize(vViewPosition)),0.0,1.0),2.6);\n          outgoingLight+=uRim*fres*0.1;                              // soft light rim, like a lit jelly ball\n          outgoingLight+=diffuseColor.rgb*(1.0-fres)*0.05;            // gentle inner glow\n          gl_FragColor = vec4( outgoingLight, diffuseColor.a );`);\n    };\n    return m;\n  }\n  const uBlueOther={value:new THREE.Vector3()}, uYelOther={value:new THREE.Vector3()};\n  const bluePivot=new THREE.Group(), yelPivot=new THREE.Group();\n  const blue=new THREE.Group(), yel=new THREE.Group();\n  bluePivot.add(blue);yelPivot.add(yel);root.add(bluePivot,yelPivot);\n  blue.add(new THREE.Mesh(geo,sphereMaterial(BLUE,false,uBlueOther)));\n  yel.add(new THREE.Mesh(geo,sphereMaterial(YELLOW,false,uYelOther)));\n  const blueGlass=new THREE.Mesh(geo,sphereMaterial(BLUE,true,uBlueOther)); blueGlass.renderOrder=5; blue.add(blueGlass);\n  const yelGlass=new THREE.Mesh(geo,sphereMaterial(YELLOW,true,uYelOther)); yelGlass.renderOrder=5; yel.add(yelGlass);\n\n  // soft contact shadows\n  function blobTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');\n    const g=x.createRadialGradient(64,64,4,64,64,62);g.addColorStop(0,'rgba(25,31,40,.35)');g.addColorStop(1,'rgba(25,31,40,0)');\n    x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
